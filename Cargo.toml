[workspace]
resolver = "3"
members = ["crates/ts3350-core", "crates/ts3350-backend", "crates/ts3350-toolset"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Sofiane Lasri"]
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
ts3350-core = { path = "crates/ts3350-core" }
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"
lopdf = { version = "0.46", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "avif"] }
ureq = "3.5"
quick-xml = "0.42"
mdns-sd = "0.21"
nix = { version = "0.30", features = ["user"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }

# Keep heavy dependencies (JPEG decoding, rav1e AVIF encoder) fast in debug builds.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
